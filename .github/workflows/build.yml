name: Build Amalia

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: amalia-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release AAB + APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.AMALIA_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release AAB (Google Play)
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          FISH_AUDIO_API_KEY:       ${{ secrets.FISH_AUDIO_API_KEY }}
          AMALIA_KEYSTORE_PASSWORD: ${{ secrets.AMALIA_KEYSTORE_PASSWORD }}
          AMALIA_KEY_ALIAS:         ${{ secrets.AMALIA_KEY_ALIAS }}
          AMALIA_KEY_PASSWORD:      ${{ secrets.AMALIA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Build release APK (sideload)
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          FISH_AUDIO_API_KEY:       ${{ secrets.FISH_AUDIO_API_KEY }}
          AMALIA_KEYSTORE_PASSWORD: ${{ secrets.AMALIA_KEYSTORE_PASSWORD }}
          AMALIA_KEY_ALIAS:         ${{ secrets.AMALIA_KEY_ALIAS }}
          AMALIA_KEY_PASSWORD:      ${{ secrets.AMALIA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: amalia-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amalia-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
